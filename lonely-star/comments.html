<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>孤星 · 读者留言 | Tower of Babel</title>
  <style>
    :root {
      --bg: #1a1e1b;
      --bg-card: #252a26;
      --text: #e8e3d9;
      --text-muted: #b0a99c;
      --accent: #f4b642;
      --border: #3d463f;
      --velak: #4a7c59;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "SimSun", serif;
      line-height: 1.8;
    }
    a { color: var(--text); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent); }

    /* Header */
    header {
      padding: 3rem 1.5rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.15em;
    }
    header .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    header .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Comment Form */
    .comment-form {
      max-width: 700px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .comment-form h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }
    .comment-form textarea {
      width: 100%;
      min-height: 120px;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1rem;
    }
    .comment-form textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .comment-form .form-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .comment-form input {
      flex: 1;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .comment-form input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .comment-form .btn {
      padding: 0.75rem 2rem;
      background: var(--velak);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .comment-form .btn:hover {
      opacity: 0.9;
    }

    /* Comment List */
    .comment-list {
      max-width: 700px;
      margin: 2rem auto 4rem;
      padding: 0 1.5rem;
    }
    .comment-list h3 {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    .comment-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .comment-item .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .comment-item .meta .nickname {
      color: var(--accent);
      font-weight: 500;
    }
    .comment-item .content {
      color: var(--text);
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .comment-item .delete-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .comment-item .delete-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
    }

    /* Admin Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
    }
    .modal h4 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }
    .modal p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .modal input {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    .modal input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .modal .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }
    .modal .modal-btn {
      padding: 0.6rem 1.25rem;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .modal .modal-btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .modal .modal-btn-cancel:hover {
      border-color: var(--accent);
    }
    .modal .modal-btn-confirm {
      background: var(--velak);
      color: #fff;
    }
    .modal .modal-btn-confirm:hover {
      opacity: 0.9;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>孤星 · 读者留言</h1>
    <p class="subtitle">VELAK09 · 七种 AI 与一个人类共生</p>
    <a href="index.html" class="back-link">← 返回孤星</a>
  </header>

  <!-- 发表评论 -->
  <div class="comment-form">
    <h3>✎ 写下你的感受</h3>
    <form id="commentForm">
      <div class="form-row">
        <input type="text" id="nickname" placeholder="昵称（可选）" maxlength="20">
      </div>
      <textarea id="content" placeholder="写下你对孤星的感受、想法或疑问..." required maxlength="1000"></textarea>
      <button type="submit" class="btn">发表留言</button>
    </form>
  </div>

  <!-- 留言列表 -->
  <div class="comment-list">
    <h3>留言墙</h3>
    <div id="commentList"></div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h4>管理员验证</h4>
      <p>请输入管理员密码以删除此留言</p>
      <input type="password" id="adminPassword" placeholder="管理员密码">
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn modal-btn-confirm" onclick="confirmDelete()">删除</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 孤星 · Tower of Babel</p>
  </footer>

  <script>
    // 配置
    const STORAGE_KEY = 'lonely_star_comments';
    const ADMIN_PASSWORD = 'velak09'; // 简单密码保护

    // 加载留言
    function loadComments() {
      const comments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const container = document.getElementById('commentList');

      if (comments.length === 0) {
        container.innerHTML = '<div class="empty-state">还没有留言，成为第一个留下足迹的人吧</div>';
        return;
      }

      container.innerHTML = comments.map((comment, index) => `
        <div class="comment-item" data-index="${index}">
          <div class="meta">
            <span class="nickname">${escapeHtml(comment.nickname || '匿名读者')}</span>
            <span class="date">${formatDate(comment.date)}</span>
          </div>
          <div class="content">${escapeHtml(comment.content)}</div>
          <button class="delete-btn" onclick="showDeleteModal(${index})">删除</button>
        </div>
      `).join('');
    }

    // 添加留言
    document.getElementById('commentForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nickname = document.getElementById('nickname').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!content) return;

      const comments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      comments.unshift({
        nickname,
        content,
        date: new Date().toISOString()
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
      document.getElementById('content').value = '';
      document.getElementById('nickname').value = '';
      loadComments();
    });

    // 删除相关
    let deleteIndex = null;

    function showDeleteModal(index) {
      deleteIndex = index;
      document.getElementById('deleteModal').classList.add('active');
      document.getElementById('adminPassword').value = '';
      document.getElementById('adminPassword').focus();
    }

    function closeModal() {
      deleteIndex = null;
      document.getElementById('deleteModal').classList.remove('active');
    }

    function confirmDelete() {
      const password = document.getElementById('adminPassword').value;
      if (password !== ADMIN_PASSWORD) {
        alert('密码错误');
        return;
      }

      const comments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      comments.splice(deleteIndex, 1);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
      closeModal();
      loadComments();
    }

    // 工具函数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(isoString) {
      const date = new Date(isoString);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // 回车提交删除
    document.getElementById('adminPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') confirmDelete();
    });

    // 初始化
    loadComments();
  </script>
</body>
</html>
