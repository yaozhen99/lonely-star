<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雾城（中间稿）| Tower of Babel</title>
  <style>
    :root {
      --bg: #1a1e1b;
      --bg-card: #252a26;
      --text: #e8e3d9;
      --text-muted: #b0a99c;
      --accent: #f4b642;
      --border: #3d463f;
      --fog: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "SimSun", serif;
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .login-box h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    .login-box .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .login-box input {
      width: 100%;
      padding: 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 1rem;
      text-align: center;
      letter-spacing: 0.3em;
    }
    .login-box input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .login-box button {
      width: 100%;
      padding: 0.85rem;
      background: var(--fog);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-box button:hover {
      opacity: 0.9;
    }
    .login-box .error {
      color: #e57373;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
    .login-box .hint {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1.5rem;
    }
    /* Content page styles */
    body.authenticated {
      display: block;
      padding: 2rem 1.5rem;
    }
    .content-header {
      max-width: 800px;
      margin: 0 auto 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .content-header h1 {
      font-size: 2rem;
      color: var(--accent);
    }
    .content-header .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .content-header .back-link {
      display: inline-block;
      margin-top: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .chapter-list {
      max-width: 800px;
      margin: 0 auto 4rem;
    }
    .chapter-list h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .chapter-list ul {
      list-style: none;
    }
    .chapter-list li {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .chapter-list li:last-child {
      border-bottom: none;
    }
    .chapter-list li a {
      color: var(--text);
      font-size: 0.95rem;
    }
    .chapter-list li a:hover {
      color: var(--accent);
    }
    .logout-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .logout-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="login-box" id="loginBox">
    <h1>雾城（中间稿）</h1>
    <p class="subtitle">工作版本 · 非最终定稿</p>
    <input type="password" id="passwordInput" placeholder="输入密码" maxlength="20">
    <button onclick="checkPassword()">进入</button>
    <p class="error" id="errorMsg">密码错误</p>
    <p class="hint">此页面仅限作者访问</p>
  </div>

  <div id="contentArea" style="display: none;">
    <button class="logout-btn" onclick="logout()">退出</button>
    <div class="content-header">
      <h1>雾城（中间稿之一）</h1>
      <p class="subtitle">工作版本 · 非最终定稿 · 共70回</p>
      <a href="../index.html" class="back-link">← 返回塔中书局</a>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </div>

    ];

    function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      if (input === PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, 'true');
        showContent();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    function showContent() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('contentArea').style.display = 'block';
      document.body.classList.add('authenticated');
      loadChapterList();
    }

    function logout() {
      sessionStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function loadChapterList() {
      const container = document.getElementById('chapterList');
      if (chapters.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">暂无章节</p>';
        return;
      }

      let html = '<h3>章节目录</h3><ul>';
      chapters.forEach(ch => {
        const displayTitle = ch.title ? `：${ch.title}` : '';
        html += `<li><a href="${ch.link}">第${ch.num}回${displayTitle}</a></li>`;
      });
      html += '</ul>';
      container.innerHTML = html;
    }

    // 回车提交
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    // 检查是否已登录
    if (sessionStorage.getItem(STORAGE_KEY) === 'true') {
      showContent();
    }
  </script>
</body>
</html>
